server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5436/notification_db}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${NOTIFICATION_CONSUMER_MAX_ATTEMPTS:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

notification:
  sender:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    backoff-seconds: ${NOTIFICATION_BACKOFF_SECONDS:30}
  internal-token: ${INTERNAL_TOKEN:ticketya-internal-dev}
  rabbit:
    queue: ${NOTIFICATION_QUEUE:notification.order}
    dlq: ${NOTIFICATION_QUEUE_DLQ:notification.order.dlq}
    event-queue: ${NOTIFICATION_EVENT_QUEUE:notification.event}
    event-dlq: ${NOTIFICATION_EVENT_DLQ:notification.event.dlq}
    favorite-queue: ${NOTIFICATION_FAVORITE_QUEUE:notification.favorite}
    favorite-dlq: ${NOTIFICATION_FAVORITE_DLQ:notification.favorite.dlq}
  preferences:
    base-url: ${RECOMMENDATION_URL:http://localhost:8084}
    connect-timeout: ${PREFERENCES_CONNECT_TIMEOUT:2s}
    read-timeout: ${PREFERENCES_READ_TIMEOUT:3s}
  mock:
    email-domain: ${NOTIFICATION_MOCK_EMAIL_DOMAIN:ticketya.local}