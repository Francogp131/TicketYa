server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:1s}
  cache:
    type: redis
    redis:
      time-to-live: ${CATALOG_CACHE_TTL:60s}
      cache-null-values: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

inventory:
  url: ${INVENTORY_URL:http://localhost:8082}
  timeout:
    connect-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${INVENTORY_READ_TIMEOUT_MS:3000}

orders:
  url: ${ORDERS_URL:http://localhost:8083}
  timeout:
    connect-ms: ${ORDERS_CONNECT_TIMEOUT_MS:1000}
    read-ms: ${ORDERS_READ_TIMEOUT_MS:2000}

catalog:
  scheduler:
    finalizacion-ms: ${CATALOG_SCHEDULER_FINALIZACION_MS:60000}
  cache:
    venue-ttl: ${CATALOG_CACHE_VENUE_TTL:10m}
    event-detail-ttl: ${CATALOG_CACHE_EVENT_DETAIL_TTL:2m}
    search-ttl: ${CATALOG_CACHE_SEARCH_TTL:30s}
  internal-token: ${INTERNAL_TOKEN:ticketya-internal-dev}
  outbox:
    publish-ms: ${CATALOG_OUTBOX_PUBLISH_MS:2000}
    batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${CATALOG_OUTBOX_MAX_ATTEMPTS:10}
    base-backoff-seconds: ${CATALOG_OUTBOX_BACKOFF_SECONDS:5}