server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: recommendation-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/recommendation_db}
      auto-index-creation: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

recommendation:
  internal-token: ${INTERNAL_TOKEN:ticketya-internal-dev}
  mongo:
    ensure-indexes: ${RECOMMENDATION_ENSURE_INDEXES:true}
  seed:
    enabled: ${RECOMMENDATION_SEED_ENABLED:true}
  rabbit:
    queue: ${RECOMMENDATION_QUEUE:recommendation.history}
  catalog:
    url: ${CATALOG_URL:http://localhost:8081}
    timeout:
      connect-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
      read-ms: ${CATALOG_READ_TIMEOUT_MS:3000}
